query QViewer { viewer { id name } }

query QTeams($first:Int!,$after:String) { teams(first:$first,after:$after) {nodes {id name} pageInfo { hasNextPage endCursor }} }

query QTeam($id:String!) { team(id:$id) { id name autoCloseParentIssues autoCloseChildIssues } }

query QStates($filter:WorkflowStateFilter,$first:Int!,$after:String) { workflowStates(filter:$filter,first:$first,after:$after) { nodes {id name type} pageInfo { hasNextPage endCursor } } }

query QLabels($first:Int!,$after:String) { issueLabels(first:$first,after:$after) {nodes {id name team {id}} pageInfo { hasNextPage endCursor }} }

query QIssueLabel($id:String!) { issueLabel(id:$id) {id name} }

query QProject($id:String!) {project(id:$id) {id name description content url archivedAt teams {nodes {id} pageInfo {hasNextPage endCursor}}}}

query QProjects($filter:ProjectFilter,$first:Int!,$after:String,$includeArchived:Boolean!) { projects(filter:$filter,first:$first,after:$after,includeArchived:$includeArchived) {nodes {id name description url} pageInfo { hasNextPage endCursor }} }

query QIssue($id:String!) { issue(id:$id) {id identifier title description url updatedAt archivedAt startedAt completedAt priority priorityLabel prioritySortOrder team { id } project { id name url } parent { id } state { id name type } labels(first:100) { nodes { id name } pageInfo {hasNextPage endCursor} }} }

query QIssues($filter:IssueFilter,$first:Int!,$after:String,$includeArchived:Boolean!) { issues(filter:$filter,first:$first,after:$after,includeArchived:$includeArchived) {nodes {id identifier title description url updatedAt archivedAt startedAt completedAt priority priorityLabel prioritySortOrder team { id } project { id name url } parent { id } state { id name type } labels(first:100) { nodes { id name } pageInfo {hasNextPage endCursor} }} pageInfo { hasNextPage endCursor }} }

query QAttachmentById($id:String!) {attachment(id:$id) {id title url metadata issue {id} originalIssue {id}}}

query QWorkAttachments($id:String!,$first:Int!,$after:String) {issue(id:$id) {attachments(first:$first,after:$after,includeArchived:true) {nodes {id title url metadata} pageInfo { hasNextPage endCursor }}}}

query QDocument($id:String!) {document(id:$id) {id title content url updatedAt archivedAt project {id} issue {id}}}

query QProjectUpdate($id:String!) {projectUpdate(id:$id) {id url body health createdAt updatedAt archivedAt project {id} user {id name}}}

query QProjectUpdates($filter:ProjectUpdateFilter,$first:Int!,$after:String,$includeArchived:Boolean!) {projectUpdates(filter:$filter,first:$first,after:$after,includeArchived:$includeArchived) {nodes {id url body health createdAt updatedAt archivedAt project {id} user {id name}} pageInfo {hasNextPage endCursor}}}

query QDocuments($filter:DocumentFilter,$first:Int!,$after:String,$includeArchived:Boolean!) {documents(filter:$filter,first:$first,after:$after,includeArchived:$includeArchived) {nodes {id title url archivedAt project {id} issue {id}} pageInfo { hasNextPage endCursor }}}

query QComment($id:String!) {comment(id:$id) {id url body createdAt updatedAt resolvedAt resolvingCommentId parent {id} issue {id} project {id} projectUpdate {id} user {id name}}}

query QComments($filter:CommentFilter,$first:Int!,$after:String,$includeArchived:Boolean!) {comments(filter:$filter,first:$first,after:$after,includeArchived:$includeArchived) {nodes {id url body createdAt updatedAt resolvedAt resolvingCommentId parent {id} issue {id} project {id} projectUpdate {id} user {id name}} pageInfo {hasNextPage endCursor}}}

query QCommentChildren($id:String!,$first:Int!,$after:String) {comment(id:$id) {children(first:$first,after:$after) {nodes {id url body createdAt updatedAt resolvedAt resolvingCommentId parent {id} issue {id} project {id} projectUpdate {id} user {id name}} pageInfo {hasNextPage endCursor}}}}

query QIssueRelations($id:String!,$first:Int!,$after:String) {issue(id:$id) {relations(first:$first,after:$after) {nodes {id type archivedAt issue {id} relatedIssue {id}} pageInfo {hasNextPage endCursor}}}}

query QHistory($id:String!,$first:Int!,$after:String) {issue(id:$id) {history(first:$first,after:$after) {nodes {id createdAt fromStateId toStateId fromParentId toParentId fromProjectId toProjectId} pageInfo { hasNextPage endCursor }}}}

query QSearchIssues($term:String!,$first:Int!,$after:String) {searchIssues(term:$term,first:$first,after:$after) {nodes {id identifier title url priority priorityLabel prioritySortOrder} pageInfo { hasNextPage endCursor }}}

query QSearchProjects($term:String!,$first:Int!,$after:String) {searchProjects(term:$term,first:$first,after:$after) {nodes {id name url} pageInfo { hasNextPage endCursor }}}

query QSearchDocuments($term:String!,$first:Int!,$after:String) {searchDocuments(term:$term,first:$first,after:$after) {nodes {id title url} pageInfo { hasNextPage endCursor }}}

mutation MCreateIssue($input:IssueCreateInput!) {issueCreate(input:$input) {success issue {id identifier title description url updatedAt archivedAt startedAt completedAt priority priorityLabel prioritySortOrder team { id } project { id name url } parent { id } state { id name type } labels(first:100) { nodes { id name } pageInfo {hasNextPage endCursor} }}}}

mutation MUpdateIssue($id:String!,$input:IssueUpdateInput!) {issueUpdate(id:$id,input:$input) {success issue {id identifier title description url updatedAt archivedAt startedAt completedAt priority priorityLabel prioritySortOrder team { id } project { id name url } parent { id } state { id name type } labels(first:100) { nodes { id name } pageInfo {hasNextPage endCursor} }}}}

mutation MCreateIssueRelation($input:IssueRelationCreateInput!) {issueRelationCreate(input:$input) {success issueRelation {id type archivedAt issue {id} relatedIssue {id}}}}

mutation MCreateProject($input:ProjectCreateInput!) {projectCreate(input:$input) {success project {id name content url}}}

mutation MUpdateProject($id:String!,$input:ProjectUpdateInput!) {projectUpdate(id:$id,input:$input) {success project {id name content url}}}

mutation MUpsertRecord($input:AttachmentCreateInput!) {attachmentCreate(input:$input) {success attachment {id metadata}}}

mutation MFileUpload($contentType:String!,$filename:String!,$size:Int!,$makePublic:Boolean) {fileUpload(contentType:$contentType,filename:$filename,size:$size,makePublic:$makePublic) {success uploadFile {assetUrl uploadUrl headers {key value} contentType filename size}}}

mutation MUpdateAttachment($id:String!,$input:AttachmentUpdateInput!) {attachmentUpdate(id:$id,input:$input) {success attachment {id metadata}}}

mutation MCreateDocument($input:DocumentCreateInput!) {documentCreate(input:$input) {success document {id title content url}}}

mutation MUpdateDocument($id:String!,$input:DocumentUpdateInput!) {documentUpdate(id:$id,input:$input) {success document {id title content url}}}

mutation MCreateComment($input:CommentCreateInput!) {commentCreate(input:$input) {success comment {id url body createdAt updatedAt resolvedAt resolvingCommentId parent {id} issue {id} project {id} projectUpdate {id} user {id name}}}}

mutation MResolveComment($id:String!,$resolvingCommentId:String) {commentResolve(id:$id,resolvingCommentId:$resolvingCommentId) {success comment {id url body createdAt updatedAt resolvedAt resolvingCommentId parent {id} issue {id} project {id} projectUpdate {id} user {id name}}}}

mutation MUnresolveComment($id:String!) {commentUnresolve(id:$id) {success comment {id url body createdAt updatedAt resolvedAt resolvingCommentId parent {id} issue {id} project {id} projectUpdate {id} user {id name}}}}

mutation MCreateProjectUpdate($input:ProjectUpdateCreateInput!) {projectUpdateCreate(input:$input) {success projectUpdate {id url body health createdAt updatedAt archivedAt project {id} user {id name}}}}

mutation MUpdateProjectUpdate($id:String!,$input:ProjectUpdateUpdateInput!) {projectUpdateUpdate(id:$id,input:$input) {success projectUpdate {id url body health createdAt updatedAt archivedAt project {id} user {id name}}}}

mutation MCreateIssueLabel($input:IssueLabelCreateInput!) {issueLabelCreate(input:$input) {success issueLabel {id name}}}
