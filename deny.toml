# Reviewed baseline allowlist, not an assertion that every future dependency is acceptable.
[advisories]
yanked = "deny"

[licenses]
# This product declares no open-source license (proprietary to the owner), so
# workspace-internal crates are excluded from license evaluation while every
# external dependency is still checked.
private = { ignore = true }
# MIT-0 (borrow-or-share via jsonschema) and CDLA-Permissive-2.0
# (webpki-root-certs via rustls) are reviewed permissive additions for this
# product's existing dependency tree.
allow = ["MIT", "MIT-0", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies carry no version; allowed only because every crate is publish = false.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
