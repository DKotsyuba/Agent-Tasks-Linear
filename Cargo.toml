[workspace]
members = ["crates/family-delivery", "xtask"]
default-members = ["."]
resolver = "3"

[workspace.package]
version = "0.6.1"
edition = "2024"
rust-version = "1.98.1"
publish = false

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
jsonschema = { version = "0.33", default-features = false }
minijinja = { version = "=2.24.0", default-features = false, features = ["serde", "macros", "multi_template", "builtins", "fuel"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls", "stream"] }
rmcp = { version = "=3.4.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-std"] }
tokio-util = "0.7"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }

[package]
name = "agent-tasks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Rust MCP for an explicit agent workflow over native Linear Projects, Issues, Documents and activity"

[dependencies]
axum = "0.8"
chrono.workspace = true
family-delivery = { path = "crates/family-delivery" }
clap.workspace = true
jsonschema.workspace = true
minijinja.workspace = true
pulldown-cmark.workspace = true
reqwest.workspace = true
rmcp = { workspace = true, features = ["server", "client", "transport-io", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
uuid.workspace = true

[dev-dependencies]
graphql-parser = "0.4"
rmcp = { workspace = true, features = ["transport-child-process"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
# Migration exception (documented in docs/TEMPLATE_PROVENANCE.md): the existing
# product predates the template's deny-level unwrap/expect lints and holds many
# post-validation JSON unwraps. New code must avoid them; presentation code
# (src/render.rs) is held to the response standard and stays unwrap/expect-free.
unwrap_used = "allow"
expect_used = "allow"

[lints]
workspace = true

[profile.release]
lto = "thin"
strip = true
