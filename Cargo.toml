[package]
name = "agent-tasks-linear"
version = "0.3.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
jsonschema = { version = "0.33", default-features = false }
minijinja = { version = "2.24.0", default-features = false, features = ["serde"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls", "stream"] }
rmcp = { version = "=3.2.0", default-features = false, features = ["server", "client", "transport-io", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-std"] }
tokio-util = "0.7"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
graphql-parser = "0.4"
rmcp = { version = "=3.2.0", features = ["transport-child-process"] }

[profile.release]
lto = "thin"
strip = true
